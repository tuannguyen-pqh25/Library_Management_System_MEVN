# ==============================================================================
# HỆ THỐNG QUẢN LÝ MƯỢN SÁCH (MEVN STACK - HỌC PHẦN CT449)
# CẤU HÌNH NGINX REVERSE PROXY & STATIC SERVE (PORT 80 & 8080)
# ==============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25M; # Cho phép upload ảnh sách và dữ liệu lớn

    # Tối ưu nén Gzip cho file tĩnh Vue 3
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream trỏ về Backend Node.js qua PM2
    upstream backend_api {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ==========================================================================
    # 1. CỔNG DÀNH CHO ĐỘC GIẢ (USER-WEB) — PORT 80
    # ==========================================================================
    server {
        listen       80;
        server_name  localhost;

        # Đường dẫn thư mục build dist của user-web (dùng dấu / chuẩn Nginx)
        # NẾU TRÊN VPS LINUX: Đổi thành /var/www/user-web/dist
        root "d:/Project/CT449/Project/frontend/user-web/dist";
        index index.html;

        # Xử lý Single Page Application (Vue Router HTML5 History Mode)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache tài nguyên tĩnh (JS, CSS, Font, Ảnh) trong thư mục assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Reverse Proxy toàn bộ API về Backend Node.js (Port 3000)
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout cho các tác vụ AI Chatbot Gemini
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Reverse Proxy phục vụ ảnh bìa sách tải lên
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Trang lỗi thân thiện
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # ==========================================================================
    # 2. CỔNG DÀNH CHO QUẢN TRỊ VIÊN & THỦ THƯ (ADMIN-WEB) — PORT 8080
    # ==========================================================================
    server {
        listen       8080;
        server_name  localhost;

        # Đường dẫn thư mục build dist của admin-web
        # NẾU TRÊN VPS LINUX: Đổi thành /var/www/admin-web/dist
        root "d:/Project/CT449/Project/frontend/admin-web/dist";
        index index.html;

        # Xử lý Single Page Application (Vue Router HTML5 History Mode)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache tài nguyên tĩnh
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Reverse Proxy toàn bộ API của Admin về Backend Node.js
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Phục vụ ảnh bìa sách
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
